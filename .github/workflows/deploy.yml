name: Build and publish Jazz Play-Along
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzband-op1r
          ref: 1a56be35c779e229aebb603c6798bbfa40261d7a
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzbook
          ref: ae727a280ef8c6c239f9e0dec10fbaa645851832
          path: catalog
      - run: bash build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4


