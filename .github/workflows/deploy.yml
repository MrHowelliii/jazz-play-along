name: Build and publish Jazz Play-Along
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzband-op1r
          ref: 3df69f6146c0d06dc48213fea4ef57d81e83f13a
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzbook
          ref: 9e439b0e7a7b7dd3df158a2706e2cebe16ca9176
          path: catalog
      - run: bash build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4


