name: Build and publish Jazz Play-Along
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzband-op1r
          ref: 3a37ac8fc128348df9766b12c8c31fd23a3f4497
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzbook
          ref: bb00f87fa77ed5157720d0c6f5025a60c3933d48
          path: catalog
      - run: bash build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4


