name: Build and publish Jazz Play-Along
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzband-op1r
          ref: 4952a7cbb451b7c03d4de34831883a0d99a2b3fc
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: MrHowelliii/jazzbook
          ref: 0bd5128807d03994b943e41f21e861f639ee1c7b
          path: catalog
      - run: bash build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4


